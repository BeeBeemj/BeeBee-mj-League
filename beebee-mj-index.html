<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BeeBee 麻將聯賽 - 公開即時戰報與榮譽榜</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --win: #22c55e;
      --lose: #ef4444;
      --gold: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
    }
    .container { max-width: 680px; margin: 0 auto; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .card-title { font-size: 15px; font-weight: 700; color: var(--text-muted); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .live-dot { display: inline-block; width: 8px; height: 8px; background: var(--win); border-radius: 50%; margin-right: 4px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    
    .awards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    .award-card { background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; padding: 10px; position: relative; }
    .award-card.full-width { grid-column: span 2; }
    .award-title { font-size: 12px; font-weight: bold; color: var(--gold); margin-bottom: 4px; }
    .award-player { font-size: 16px; font-weight: 900; color: #fff; }
    .award-stat { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .stats-table-wrapper { overflow-x: auto; }
    table.stats-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
    table.stats-table th, table.stats-table td { padding: 8px 4px; border-bottom: 1px solid var(--card-border); white-space: nowrap; }
    table.stats-table th { background: #0f172a; color: var(--text-muted); font-size: 12px; }
    .highlight-cell { font-weight: bold; font-family: monospace; }

    /* 兩層折疊式卡片 */
    .session-archive-card {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .session-archive-header {
      padding: 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      user-select: none;
    }
    .session-archive-header:hover { background: #243247; }
    .session-detail-panel {
      padding: 12px;
      background: #0b1120;
      border-top: 1px solid var(--card-border);
      display: none;
    }
    .session-detail-panel.open { display: block; }
  </style>
</head>
<body>
<div class="container">
  <div style="text-align: center; margin-bottom: 16px;">
    <h2 style="margin: 0 0 4px 0;">🀄 BeeBee 麻將聯賽即時戰報</h2>
    <div style="font-size: 12px; color: var(--text-muted);">
      <span class="live-dot"></span> 雲端連線即時同步中
    </div>
  </div>

  <!-- 7 大趣味榮譽榜 -->
  <div class="card">
    <div class="card-title">
      <span>👑 聯賽數據榮譽榜</span>
      <span style="font-size: 11px; color: var(--text-muted);">局數比率排名</span>
    </div>
    <div class="awards-grid" id="awardsContainer"></div>
  </div>

  <!-- 生涯總積分勝率榜 (純勝負) -->
  <div class="card">
    <div class="card-title">
      <span>🏆 選手時時總積分排行榜 (勝率排行)</span>
      <span id="leagueMatchesTotal" style="color: var(--gold); font-size: 12px;">累計：0 場 / 0 將</span>
    </div>
    <div class="stats-table-wrapper">
      <table class="stats-table">
        <thead>
          <tr>
            <th>選手</th>
            <th>總積分</th>
            <th>出賽將數</th>
            <th style="color: var(--win);">胡</th>
            <th style="color: #6ee7b7;">摸</th>
            <th style="color: var(--lose);">槍</th>
            <th style="color: #fda4af;">被摸</th>
            <th style="color: var(--text-muted);">沒事</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 歷場戰報 (兩層式折疊) -->
  <div class="card">
    <div class="card-title">
      <span>📜 歷場戰報 (點擊場次展開明細)</span>
      <span id="matchArchiveCount" style="color: var(--gold); font-size: 12px;">共 0 場</span>
    </div>
    <div id="archivedSessionsContainer"></div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBR1MDwPYyF85gADhJWxqN49C4JhL9Jrpw",
    authDomain: "beebee-mj.firebaseapp.com",
    databaseURL: "https://beebee-mj-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "beebee-mj",
    storageBucket: "beebee-mj.firebasestorage.app",
    messagingSenderId: "455969527844",
    appId: "1:455969527844:web:81d87e8b14620a6d6ba0b1"
  };

  firebase.initializeApp(firebaseConfig);
  const dbRef = firebase.database().ref("league_data");

  dbRef.on("value", snapshot => {
    const DB = snapshot.val();
    if (!DB) return;

    const displayStats = JSON.parse(JSON.stringify(DB.playerStats || {}));
    if (DB.currentSession && DB.currentMatch && DB.currentMatch.seats) {
      DB.currentMatch.seats.forEach((name, idx) => {
        if (displayStats[name]) displayStats[name].totalScore += (DB.currentMatch.scores ? DB.currentMatch.scores[idx] : 0);
      });
    }

    const totalSessions = DB.archivedSessions ? DB.archivedSessions.length : 0;
    document.getElementById("leagueMatchesTotal").innerText = `累計：${totalSessions} 場 / ${DB.totalLeagueMatches || 0} 將`;

    const playerMetrics = (DB.roster || []).map(name => {
      const p = displayStats[name] || { totalScore: 0, matchesPlayed: 0, hu: 0, mo: 0, qiang: 0, beiMo: 0, nothing: 0 };
      const totalRounds = (p.hu || 0) + (p.mo || 0) + (p.qiang || 0) + (p.beiMo || 0) + (p.nothing || 0);
      return {
        name,
        totalScore: p.totalScore || 0,
        matchesPlayed: p.matchesPlayed || 0,
        hu: p.hu || 0,
        mo: p.mo || 0,
        qiang: p.qiang || 0,
        beiMo: p.beiMo || 0,
        nothing: p.nothing || 0,
        totalRounds,
        zimoRate: totalRounds > 0 ? (p.mo / totalRounds) : 0,
        huRate: totalRounds > 0 ? (p.hu / totalRounds) : 0,
        laohuRate: totalRounds > 0 ? ((p.hu + p.mo) / totalRounds) : 0,
        qiangRate: totalRounds > 0 ? (p.qiang / totalRounds) : 0,
        peidaRate: totalRounds > 0 ? (p.nothing / totalRounds) : 0,
        ashuaiRate: totalRounds > 0 ? (p.beiMo / totalRounds) : 0
      };
    });

    renderAwards(playerMetrics);

    const sorted = [...playerMetrics].sort((a, b) => b.totalScore - a.totalScore);
    const tbody = document.getElementById("leaderboardBody");
    tbody.innerHTML = "";

    sorted.forEach((p, idx) => {
      let color = p.totalScore > 0 ? "var(--win)" : (p.totalScore < 0 ? "var(--lose)" : "var(--text-muted)");
      tbody.innerHTML += `
        <tr>
          <td style="font-weight: bold; text-align: left;"><span style="color: var(--gold); font-size: 11px;">#${idx+1}</span> ${p.name}</td>
          <td class="highlight-cell" style="color: ${color}; font-size: 14px;">${p.totalScore > 0 ? '+' + p.totalScore : p.totalScore}</td>
          <td style="font-weight: bold;">${p.matchesPlayed}</td>
          <td style="color: var(--win); font-weight: bold;">${p.hu}</td>
          <td style="color: #6ee7b7; font-weight: bold;">${p.mo}</td>
          <td style="color: var(--lose); font-weight: bold;">${p.qiang}</td>
          <td style="color: #fda4af;">${p.beiMo}</td>
          <td style="color: var(--text-muted);">${p.nothing}</td>
        </tr>
      `;
    });

    // 渲染歷場戰報
    const container = document.getElementById("archivedSessionsContainer");
    const sessions = DB.archivedSessions || [];
    document.getElementById("matchArchiveCount").innerText = `共 ${sessions.length} 場`;

    if (sessions.length === 0) {
      container.innerHTML = `<div style="color: var(--text-muted); text-align: center; padding: 20px;">尚無已封存場次</div>`;
      return;
    }

    container.innerHTML = sessions.map((sess, sIdx) => {
      const sessionScoreTotals = {};
      let totalSessionDong = 0;

      sess.matches.forEach(m => {
        totalSessionDong += (m.dongTotalPool || 100);
        m.seats.forEach((name, i) => {
          sessionScoreTotals[name] = (sessionScoreTotals[name] || 0) + m.scores[i];
        });
      });

      const totalScoreBadges = Object.keys(sessionScoreTotals).map(name => {
        const sc = sessionScoreTotals[name];
        const color = sc > 0 ? 'var(--win)' : (sc < 0 ? 'var(--lose)' : 'var(--text-muted)');
        return `<span>${name}: <b style="color:${color};">${sc > 0 ? '+'+sc : sc}</b></span>`;
      }).join(" ｜ ");

      const matchesDetailsHtml = sess.matches.map(m => {
        const rows = m.seats.map((name, i) => {
          const sc = m.scores[i];
          const color = sc > 0 ? 'var(--win)' : (sc < 0 ? 'var(--lose)' : 'var(--text-muted)');
          return `<span>${name}: <b style="color:${color};">${sc > 0 ? '+'+sc : sc}</b></span>`;
        }).join(" ｜ ");

        return `
          <div style="background:#1e293b; border:1px solid var(--card-border); border-radius:6px; padding:8px 10px; margin-bottom:6px;">
            <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:bold; color:var(--gold); margin-bottom:4px;">
              <span>第 ${m.matchNumber} 將 (${m.time})</span>
              <span style="color:var(--text-muted);">東錢池：${m.dongTotalPool || 100} 點</span>
            </div>
            <div style="font-size:12px; line-height:1.5;">${rows}</div>
          </div>
        `;
      }).join("");

      return `
        <div class="session-archive-card">
          <div class="session-archive-header" onclick="togglePublicSessionAccordion(${sIdx})">
            <div>
              <span style="font-size:14px; font-weight:bold; color:#fff;">📁 ${sess.name}</span>
              <span style="font-size:12px; color:var(--text-muted); margin-left:6px;">(${sess.date} ｜ 共 ${sess.matches.length} 將)</span>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-size:11px; color:var(--gold);">東錢 ${totalSessionDong} 點</span>
              <span style="font-size:12px; color:var(--primary);" id="pubArrowIcon-${sIdx}">▼ 展開</span>
            </div>
          </div>
          <div class="session-detail-panel" id="pubSessionPanel-${sIdx}">
            <div style="font-size:12px; color:var(--text-muted); margin-bottom:8px; padding-bottom:6px; border-bottom:1px dashed var(--card-border);">
              <b>【當日全場結算總計】</b><br>${totalScoreBadges}
            </div>
            <div style="font-size:12px; font-weight:bold; color:#fff; margin-bottom:6px;">【各將獨立戰報】</div>
            ${matchesDetailsHtml}
          </div>
        </div>
      `;
    }).join("");
  });

  function togglePublicSessionAccordion(sIdx) {
    const panel = document.getElementById(`pubSessionPanel-${sIdx}`);
    const arrow = document.getElementById(`pubArrowIcon-${sIdx}`);
    if (panel.classList.contains("open")) {
      panel.classList.remove("open");
      arrow.innerText = "▼ 展開";
    } else {
      panel.classList.add("open");
      arrow.innerText = "▲ 收合";
    }
  }

  function renderAwards(players) {
    if (players.length === 0) return;
    const findTop = (key) => [...players].sort((a, b) => b[key] - a[key])[0];
    const topScore = findTop('totalScore');
    const topZimo = findTop('zimoRate');
    const topHu = findTop('huRate');
    const topLaohu = findTop('laohuRate');
    const topQiang = findTop('qiangRate');
    const topPeida = findTop('peidaRate');
    const topAshuai = findTop('ashuaiRate');

    const fmtPct = (val) => (val * 100).toFixed(1) + "%";

    const awardsHtml = `
      <div class="award-card full-width">
        <div class="award-title">🏆 勝率排行第一 (總積分王)</div>
        <div class="award-player">${topScore.name} <span style="color:var(--gold); font-size:16px;">(${topScore.totalScore > 0 ? '+' : ''}${topScore.totalScore} 點)</span></div>
        <div class="award-stat">出賽 ${topScore.matchesPlayed} 將 / 累計勝局 ${topScore.hu + topScore.mo} 次</div>
      </div>
      <div class="award-card">
        <div class="award-title">🌟 自摸王</div>
        <div class="award-player">${topZimo.name}</div>
        <div class="award-stat">自摸率：<b>${fmtPct(topZimo.zimoRate)}</b> (${topZimo.mo} 次)</div>
      </div>
      <div class="award-card">
        <div class="award-title">🎯 抓槍王</div>
        <div class="award-player">${topHu.name}</div>
        <div class="award-stat">胡牌率：<b>${fmtPct(topHu.huRate)}</b> (${topHu.hu} 次)</div>
      </div>
      <div class="award-card">
        <div class="award-title">👑 老胡 (總勝出率)</div>
        <div class="award-player">${topLaohu.name}</div>
        <div class="award-stat">勝出率：<b>${fmtPct(topLaohu.laohuRate)}</b> (${topLaohu.hu + topLaohu.mo} 次)</div>
      </div>
      <div class="award-card">
        <div class="award-title">💥 槍王 (放槍率)</div>
        <div class="award-player" style="color:var(--lose);">${topQiang.name}</div>
        <div class="award-stat">放槍率：<b>${fmtPct(topQiang.qiangRate)}</b> (${topQiang.qiang} 次)</div>
      </div>
      <div class="award-card">
        <div class="award-title">🍵 陪打王 (沒事率)</div>
        <div class="award-player">${topPeida.name}</div>
        <div class="award-stat">防守沒事率：<b>${fmtPct(topPeida.peidaRate)}</b> (${topPeida.nothing} 次)</div>
      </div>
      <div class="award-card">
        <div class="award-title">🌧️ 阿衰 (被摸率)</div>
        <div class="award-player" style="color:#fda4af;">${topAshuai.name}</div>
        <div class="award-stat">被自摸率：<b>${fmtPct(topAshuai.ashuaiRate)}</b> (${topAshuai.beiMo} 次)</div>
      </div>
    `;

    document.getElementById("awardsContainer").innerHTML = awardsHtml;
  }
</script>
</body>
</html>
